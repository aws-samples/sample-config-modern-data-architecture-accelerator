# All resources will be deployed to the default region specified in the environment or AWS configurations.
# Can optional specify a specific AWS Region Name.
region: default

# One or more tag files containing tags which will be applied to all deployed resources
tag_configs:
  - ./tags.yaml

# TODO: Set an appropriate, unique organization name
# Failure to do so may result in global naming conflicts.
organization: test-agentic-org

# TODO: Set appropriate context values for your environment.
# All values below are placeholders and must be replaced.
context:
  # remove these two cognito entries if not using cognito for runtime auth
  cognito_user_pool_id: us-east-1_000000001 # TODO: Replace with your Cognito User Pool ID
  cognito_client_id: example_ClientId_000 # TODO: Replace with your Cognito Client ID
  vpc_id: vpc-00000000000000001 # TODO: Replace with your VPC ID (must contain the subnets below)
  security_group_id: sg-00000000000000001 # TODO: Replace with your Security Group ID
  subnet_id_1: subnet-00000000000000001 # TODO: Replace with your first Subnet ID
  subnet_id_2: subnet-00000000000000002 # TODO: Replace with your second Subnet ID
  # Address subscribed to the alarm/alert SNS topic. SNS sends a confirmation request
  # that must be accepted before any notification is delivered, so use a mailbox you
  # can read. Until it is confirmed, the alerting deploys but notifies nobody.
  notification_email: admin@example.com # TODO: Replace with a real address you monitor

# One or more domains may be specified. Domain name will be incorporated by default naming implementation
# to prefix all resource names.
domains:
  # Account-wide governance resources, kept in their own domain so they are owned and
  # named separately from the application that consumes them. Declared FIRST: domains
  # deploy in the order they appear here, and the 'ai' domain below reads this domain's
  # SSM parameters.
  governance:
    environments:
      dev:
        modules:
          # This module creates the role granted read access to the audit bucket and
          # decrypt on the audit CMK. It must stay ABOVE audit: both are deployStage 1, and
          # modules within a stage deploy in the order they appear here, so this publishes
          # the SSM parameter that audit's 'generated-role-id:audit-reader' resolves.
          roles:
            module_path: "@aws-mdaa/roles"
            module_configs:
              - ./roles/roles.yaml

          # This module creates the audit bucket and KMS CMK that the CloudTrail trail in
          # the 'ai' domain delivers to, plus a Glue table for querying the records from
          # Athena. One audit destination can serve many trails.
          audit:
            module_path: "@aws-mdaa/audit"
            module_configs:
              - ./audit/audit.yaml

  # The named of the domain. In this case, we are building an 'ai' domain.
  ai:
    # One or more environments may be specified, typically along the lines of 'dev', 'test', and/or 'prod'
    environments:
      # The environment name will be incorporated into resource name by the default naming implementation.
      dev:
        # The list of modules which will be deployed. A module points to a specific MDAA CDK App, and
        # specifies a deployment configuration file if required.
        modules:
          # This module will create AgentCore runtime
          agent-core-app:
            module_path: "@aws-mdaa/bedrock-agentcore-runtime"
            module_configs:
              - ./bedrock-agentcore-runtime/bedrock-agentcore-runtime.yaml

          # This module creates the CloudTrail trail that logs the AgentCore management and
          # data events this runtime's eventBridgeAlerts rules match. Without it those rules
          # deploy cleanly and never fire.
          #
          # It lives in this domain rather than in 'governance' because the trail is scoped
          # to this runtime: it reads the runtime ARN from the module above. The audit
          # bucket and key it writes to are account-wide and stay in 'governance'.
          #
          # audit-trail is deployStage 2, so it deploys after the stage-1 runtime above
          # regardless of the order here.
          audit-trail:
            module_path: "@aws-mdaa/audit-trail"
            module_configs:
              - ./audit-trail/audit-trail.yaml
