agentRuntimeName: "{{org}}-myAgentRuntimeDev"
description: "Agent runtime for development environment"

agentRuntimeArtifact:
  containerConfiguration:
    codePath: ./agent_core_code
    platform: linux/arm64

# Only the agent's own settings belong here.
#
# The OTEL_* variables are deliberately ABSENT. AgentCore Runtime configures the ADOT
# SDK inside the container, so setting them here would override a service-maintained
# configuration - OTEL_SERVICE_NAME especially, which takes precedence over the
# service's service.name resource attribute and would change the identity this agent
# reports to the CloudWatch GenAI Observability console. Recipes listing
# OTEL_RESOURCE_ATTRIBUTES, AGENT_OBSERVABILITY_ENABLED and friends are for agents
# hosted OUTSIDE AgentCore Runtime; they do not apply here. Please do not add them.
#
# Span routing needs nothing here either: MDAA sets UNIFIED_TRACES_DESTINATION_ENABLED
# to 'true' so spans land in this agent's own log group - encrypted, retained, and
# PII-masked per the settings below - rather than the account-shared aws/spans group.
# Add UNIFIED_TRACES_DESTINATION_ENABLED: 'false' only to opt out of that.
environmentVariables:
  ENVIRONMENT: dev
  LOG_LEVEL: INFO

# MDAA requires VPC configuration (security requirement).
# vpcId is required when enforceVpcOnly is true.
networkConfiguration:
  vpcId: "{{context:vpc_id}}"
  securityGroups:
    - "{{context:security_group_id}}"
  subnets:
    - "{{context:subnet_id_1}}"
    - "{{context:subnet_id_2}}"
  # Create the AgentCore interface VPC endpoint (com.amazonaws.{{region}}.bedrock-agentcore).
  # Presence of this block opts in; an empty block ({}) accepts all defaults - Private DNS,
  # an endpoint policy restricted to AgentCore invoke actions, and a security group allowing
  # HTTPS only from the application security groups above.
  #
  # Required here because enforceVpcOnly is set below. That resource policy tests
  # aws:SourceVpc, and a request only carries that condition key when it arrives through a
  # VPC endpoint - without one, nothing can invoke the runtime.
  #
  # If the VPC already has a bedrock-agentcore endpoint (created by AWS Landing Zone
  # Accelerator or a central networking team, say), REMOVE this block: only one endpoint
  # with Private DNS is allowed per service per VPC, and a second one fails to deploy.
  vpcEndpoint: {}
  # To customize, replace the line above with a populated block, e.g.:
  # vpcEndpoint:
  #   # Restrict the endpoint policy to specific IAM principals. Omitted here because the
  #   # runtime uses JWT auth below, and OAuth callers have no IAM identity for an endpoint
  #   # policy to match - restricting principals would lock them out.
  #   endpointPolicy:
  #     allowPrincipals:
  #       - 'arn:aws:iam::{{account}}:role/my-caller-role'
  #   # Also create supporting endpoints (ECR API, ECR Docker, STS, CloudWatch Logs) for
  #   # fully private subnets with no NAT gateway.
  #   createSupportingEndpoints: true

# Enforce VPC-only invocation for JWT/OAuth callers via resource-based policy.
# SCPs and endpoint policies cannot restrict OAuth callers, since they are not IAM
# principals - hence a resource policy with an aws:SourceVpc condition, satisfied by the
# vpcEndpoint above.
enforceVpcOnly: true

# CloudWatch Data Protection (PII masking) and CMK encryption of the runtime log groups
# are always-on, built-in behavior and cannot be disabled. The built-in identifier set
# (EmailAddress, CreditCardNumber, Ssn-US, Name, Address, PhoneNumber-US, IpAddress) is
# always masked. Optionally mask ADDITIONAL identifiers on top of that floor (additive
# only - cannot narrow the built-in masking).
dataProtection:
  additionalIdentifiers:
    - "DriversLicense-US"
    - "PassportNumber-US"
# Retain runtime logs for 90 days
logRetentionDays: 90

# Optional CloudWatch alarms on the AgentCore service metrics (namespace
# AWS/Bedrock-AgentCore). The presence of this block enables alarms; omit it to
# deploy none. Provide a notification target via exactly one of
# notificationTopicArn (an existing SNS topic) or createNotificationTopic
# (a module-created CMK-encrypted topic, reusing the runtime log-group KMS key),
# and at least one threshold.
alarms:
  # Alarm when the error rate exceeds 10% of invocations over the period
  errorRateThreshold: 10
  # Alarm when the throttle count exceeds 100 over the period
  throttleCountThreshold: 100
  # Create a CMK-encrypted SNS topic for notifications (self-contained; no
  # pre-existing topic needed). The topic ARN is exported to SSM.
  createNotificationTopic: true
  # Addresses subscribed to that topic. Creating a topic is NOT the same as being
  # notified by it: a topic with no subscribers accepts every alarm notification and
  # discards it, so the alerting deploys cleanly and is silently inert. Each address
  # receives an SNS confirmation request and must confirm before delivery begins.
  # MDAA warns at synth if a created topic has no subscribers.
  notificationEmails:
    - "{{context:notification_email}}"
  # On a low-traffic runtime a single 5-minute period containing one error out of one
  # invocation is a 100% error rate, so require 2 of 3 breaching periods before
  # notifying rather than paging on the first blip.
  evaluationPeriods: 3
  datapointsToAlarm: 2

# Optional EventBridge rules alerting on individual AgentCore CloudTrail events for
# this runtime. Where the alarms above detect statistical conditions (a rate or count
# over a period), these detect single events as they happen. Presence of the block
# enables it; omit it to create no rules. Requires the alarms block above, whose SNS
# topic is the default target for every rule.
#
# PREREQUISITE - a CloudTrail trail in this account/region logging the matched events.
# This starter kit does NOT deploy one. Without a trail the rules deploy cleanly and
# never fire, which reads as coverage you do not have. Two categories behave
# differently and both matter:
#   * Management events (UpdateAgentRuntime, DeleteAgentRuntime) are logged by default
#     on any trail, so `config-change` works as soon as a trail exists.
#   * Data events (InvokeAgentRuntime, and the authorization failures that come with
#     it) are OFF by default and need an explicit advanced event selector on the trail
#     for resource types AWS::BedrockAgentCore::Runtime and
#     AWS::BedrockAgentCore::RuntimeEndpoint. `auth-failure` stays silent until then.
# Deploy a trail via the MDAA audit-trail module or create one out-of-band, then
# confirm rule matches in the EventBridge console before relying on these alerts.
eventBridgeAlerts:
  rules:
    auth-failure:
      description: "Denied AgentCore invocations"
      # Which denials this rule sees depends on how the runtime is authorized. This config
      # uses the JWT authorizer below, so a caller presenting a bad or expired Cognito
      # token is refused by that authorizer and never reaches IAM: no IAM authorization
      # failure is recorded and this rule stays quiet. What it does catch here are
      # resource-policy denials - notably the enforceVpcOnly denial for a caller outside
      # the VPC, which CloudTrail records as an authorization failure. So do not read a
      # quiet auth-failure rule as proof it is misconfigured; check the trail records
      # first. Under IAM auth (no authorizerConfiguration) denied callers are IAM
      # principals and their denials are recorded directly.
      #
      # CloudTrail errorCode values, NOT SDK exception names - for authorization the
      # two differ. An IAM denial returns AccessDeniedException to the caller but is
      # recorded by CloudTrail as plain 'AccessDenied'. Do not configure
      # 'AccessDeniedException': CloudTrail never emits it for authorization, so a rule
      # using it would match nothing.
      errorCodes:
        - "AccessDenied"
    config-change:
      description: "Out-of-band runtime configuration change"
      # Detects lifecycle changes made outside this IaC deployment.
      eventNames:
        - "UpdateAgentRuntime"
        - "DeleteAgentRuntime"
      # Optionally also invoke a customer-supplied remediation function. MDAA does not
      # create one: revoking an execution role or stopping sessions is destructive and
      # site-specific, so the action stays a deliberate decision. Uncomment and set to
      # a function ARN in this account to enable.
      # targetLambdaArn: "arn:{{partition}}:lambda:{{region}}:{{account}}:function:my-remediation"

# Remove this section if you just want IAM auth.
#
# Exactly one of `cognito` or `discoveryUrl` is required. This config uses `cognito`, so
# MDAA creates the user pool and app client and composes the discovery URL and audience
# itself - no pool needs to exist beforehand, and no IDs need to be pasted into mdaa.yaml.
# The pool ID, client ID, and discovery URL are published to SSM after deploy (see the
# README's post-deployment steps).
#
# To point at an identity provider you already run instead, replace the whole `cognito`
# block with:
#   discoveryUrl: "https://my-idp.example.com/.well-known/openid-configuration"
#   allowedAudience:
#     - "my-existing-client-id"
authorizerConfiguration:
  customJwtAuthorizer:
    cognito:
      # (Optional) ID and access token validity in minutes. Defaults to 15. Short-lived
      # tokens narrow the window in which a leaked token stays usable, which matters more
      # for autonomous agents than for interactive users because JWT validation is offline
      # and cannot revoke an individual token. Accepts 5-60.
      idTokenValidityMinutes: 15
      # (Optional) MFA enforcement: off | optional | required. Defaults to required,
      # which is what this sample uses: every user registers a TOTP authenticator before
      # their first token.
      #
      # `required` is workable here because `hostedUi` below is configured - Cognito's
      # managed login is what walks each user through that registration. Without a hosted
      # UI your own application has to drive the enrolment flow itself (see the module
      # README's MFA section), and a caller with no human present cannot enrol at all -
      # set `optional` for that case, since storing a TOTP seed beside the password would
      # make the second factor a second copy of the first.
      mfa: required
      # (Optional) Pool removal policy: destroy | retain. Defaults to retain, which keeps
      # the pool and its users when the stack is deleted and enables Cognito deletion
      # protection. Set destroy for a throwaway deployment you want torn down completely -
      # that deletes the pool and every user record in it.
      removalPolicy: retain
      # Cognito's hosted UI (managed login), which is what makes an interactive human
      # sign-in possible: the user authenticates in a browser, enrols their TOTP
      # authenticator, and the browser is redirected back with an authorization code to
      # exchange for tokens. Omit this block and the app client has OAuth disabled
      # entirely. Two consequences worth knowing before adding it:
      #
      #   * The app client drops the plaintext-password auth flow (USER_PASSWORD_AUTH),
      #     because sign-in goes through the code grant instead. There is no
      #     single-API-call way to obtain a token while this block is present - the
      #     README's post-deployment steps use the browser flow.
      #   * Only the authorization code grant is enabled. The implicit grant is never
      #     offered: it returns tokens in the redirect fragment, where they land in
      #     browser history and referrer headers.
      hostedUi:
        # Redirect URIs permitted after a successful sign-in. Required - a hosted UI with
        # no callback URL cannot complete the code grant. Must be https, except
        # http://localhost, which Cognito permits for local testing.
        #
        # localhost here so the sample needs no front end deployed: you sign in through
        # managed login in a browser and read the `code` parameter off the redirect that
        # nothing is listening for (see the README's post-deployment steps). Replace both
        # URLs with your front end's real https endpoints once it exists.
        callbackUrls:
          - "http://localhost:8000/callback"
        logoutUrls:
          - "http://localhost:8000/logout"
        # (Optional) Hosted-UI domain prefix. Defaults to an MDAA naming-derived value,
        # published to SSM after deploy so the README can read it back. Cognito domain
        # prefixes are globally unique per region, so set this explicitly if deployment
        # reports that the domain already exists.
        # cognitoDomainPrefix: "my-agent-login"
        # (Optional) OAuth scopes. Defaults to openid, profile, email, which is what this
        # sample uses. Keep `openid` in any override: Cognito issues an ID token only when
        # it is requested, and the ID token is what the runtime's authorizer validates.
      # (Optional) Federation with an enterprise IdP, so users sign in with their existing
      # corporate credentials instead of a Cognito-local password. At most one of saml or
      # oidc. It requires the `hostedUi` block above - Cognito signs federated users in
      # only through the hosted-UI endpoints, never InitiateAuth:
      #   federation:
      #     saml:
      #       metadataUrl: 'https://login.microsoftonline.com/{tenant}/federationmetadata/2007-06/federationmetadata.xml'
      # Cognito applies no MFA of its own to federated users - the IdP authenticates them -
      # so enforce MFA there and set `mfa: off` here if every user is federated.
    #
    # `allowedAudience` is deliberately absent: MDAA adds the app client it creates, and
    # callers on this path present the Cognito ID token whose `aud` claim carries that
    # client ID. Set it only to accept ADDITIONAL audiences beyond the created client.

# Optional: Restrict model invocation to specific Bedrock model arns (least privilege)
allowedModelArns:
  - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
  - arn:aws:bedrock:*:{{account}}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0

# Additional policies to complement the minimum required for the execution role permissions
policies:
  - policyArn: arn:aws:iam::aws:policy/CloudWatchLogsReadOnlyAccess

# optional runtime endpoint in addition to the DEFAULT
# this is the endpoint to add to your qualifier when using the AgentCore client
runtimeEndpoint:
  name: my_agent_runtime_endpoint_dev
  description: "Runtime endpoint for development"
